services:
  api:
    environment:
      PYTHONPATH: /app/src
    volumes:
      - ./src:/app/src:ro
      - ./migrations:/app/migrations:ro
  ingestion-worker:
    environment:
      PYTHONPATH: /app/src
    volumes:
      - ./src:/app/src:ro
  frontend:
    build:
      target: development
    environment:
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  frontend-node-modules:
