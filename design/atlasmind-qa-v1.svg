<g transform="translate(1238 552)"><rect width="344" height="202" rx="14" fill="#fff" stroke="#dfdfda"/><rect x="16" y="16" width="38" height="38" rx="10" fill="#eef3f5"/><path d="M27 25h10l5 5v15H27Zm10 0v6h5" fill="none" stroke="#547a8c" stroke-width="1.6"/><text x="66" y="31" class="sm h">销售流程 SLA 指引.pdf</text><text x="66" y="50" class="xs m">第 2 页 · 审核时效</text><line x1="16" x2="328" y1="69" y2="69" class="ln"/><text x="16" y="95" class="xs m">相关段落</text><text x="16" y="120" class="sm b">“普通合同审核时限为 2 个工作日；战略</text><text x="16" y="142" class="sm b">客户或含非标准条款合同，审核时限为</text><text x="16" y="164" class="sm b">5 个工作日。超时自动提醒负责人…”</text><rect x="16" y="175" width="60" height="18" rx="9" fill="#f1f1ed"/><text x="27" y="188" font-size="11" fill="#70747e">相关</text></g>
