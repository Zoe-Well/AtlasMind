<!-- chat area -->
<rect x="276" width="944" height="1000" fill="#fcfcfb"/><line x1="276" x2="1220" y1="71.5" y2="71.5" class="ln"/>
<text x="310" y="31" class="sm m">企业知识助手</text><text x="310" y="52" class="lg h">年度销售制度有哪些变化？</text>
<g transform="translate(1047 19)"><rect width="138" height="36" rx="10" fill="#fff" stroke="#e1e1dd"/><circle cx="20" cy="18" r="4" fill="#55a678"/><text x="32" y="22" class="sm b">企业知识库</text><path d="m119 15 4 4 4-4" class="ic"/></g>
<text x="342" y="127" class="xs m">今天 10:42</text>
<g transform="translate(598 151)"><rect width="544" height="70" rx="16" fill="#eef0fb"/><text x="22" y="30" class="md b">请帮我总结一下 2026 年销售管理制度的主要变化，</text><text x="22" y="53" class="md b">尤其是报价审批和合同审核部分。</text></g>

<g transform="translate(342 262)">
  <rect width="34" height="34" rx="10" fill="#4d55ca"/><path d="M9 24 17 9l8 15M12 19h10" fill="none" stroke="#fff" stroke-width="1.9"/><text x="48" y="22" class="md h">AtlasMind</text>
  <rect x="137" y="6" width="84" height="23" rx="12" fill="#edf4ef"/><circle cx="151" cy="17" r="3.5" fill="#55a678"/><text x="160" y="21.5" class="xs" fill="#48765a">已查阅 3 篇</text>
  <text x="48" y="67" class="md b">根据《2026 销售管理制度》及相关流程文件，本年度主要有三项变化：</text>
  <circle cx="59" cy="106" r="12" fill="#ececf8"/><text x="59" y="111" text-anchor="middle" class="xs" fill="#4d55ca" font-weight="700">1</text><text x="82" y="106" class="md h">报价审批分级更细</text>
  <text x="82" y="134" class="md b">标准折扣权限调整为三级：不超过 10% 由区域负责人审批，10%–20%</text><text x="82" y="158" class="md b">需销售总监审批，超过 20% 需提交价格委员会。</text>
  <circle cx="59" cy="201" r="12" fill="#ececf8"/><text x="59" y="206" text-anchor="middle" class="xs" fill="#4d55ca" font-weight="700">2</text><text x="82" y="201" class="md h">合同审核新增数据合规检查</text>
  <text x="82" y="229" class="md b">涉及客户数据处理、跨境传输或第三方系统接入的合同，必须在法务审核前</text><text x="82" y="253" class="md b">完成信息安全与数据合规评估。</text>
  <circle cx="59" cy="296" r="12" fill="#ececf8"/><text x="59" y="301" text-anchor="middle" class="xs" fill="#4d55ca" font-weight="700">3</text><text x="82" y="296" class="md h">审批时效纳入流程管理</text>
  <text x="82" y="324" class="md b">普通合同原则上 2 个工作日内完成审核；战略客户或非标准条款合同为</text><text x="82" y="348" class="md b">5 个工作日，超过时限会自动提醒流程负责人。</text>
  <rect x="48" y="380" width="752" height="64" rx="12" fill="#f4f4f1"/><path d="M68 397h12l4 4v20H68Zm12 0v5h4" class="ic"/><text x="96" y="404" class="xs m">回答依据</text><text x="96" y="426" class="sm b">右侧证据面板展示了本次回答引用的文档与对应段落摘要。</text>
  <g transform="translate(48 464)"><rect width="34" height="30" rx="8" fill="#f2f2ef" stroke="#e5e4e0"/><text x="17" y="21" text-anchor="middle" class="sm m">＋</text><rect x="42" width="34" height="30" rx="8" fill="#f2f2ef" stroke="#e5e4e0"/><text x="59" y="20" text-anchor="middle" class="sm m">✓</text><text x="88" y="20" class="xs m">内容由企业知识库生成，请结合实际制度确认</text></g>
</g>

