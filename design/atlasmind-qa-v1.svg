<g transform="translate(1238 120)"><rect width="344" height="202" rx="14" fill="#fff" stroke="#dfdfda"/><rect x="16" y="16" width="38" height="38" rx="10" fill="#eef0fb"/><path d="M27 25h10l5 5v15H27Zm10 0v6h5" fill="none" stroke="#4d55ca" stroke-width="1.6"/><text x="66" y="31" class="sm h">2026 销售管理制度.pdf</text><text x="66" y="50" class="xs m">第 4 页 · 3.2 报价审批</text><line x1="16" x2="328" y1="69" y2="69" class="ln"/><text x="16" y="95" class="xs m">相关段落</text><text x="16" y="120" class="sm b">“销售报价按折扣比例实行分级审批。</text><text x="16" y="142" class="sm b">折扣不超过 10% 的，由区域负责人审</text><text x="16" y="164" class="sm b">批；超过 20% 的，须提交价格委员会…”</text><rect x="16" y="175" width="74" height="18" rx="9" fill="#edf4ef"/><text x="27" y="188" font-size="11" fill="#48765a">高度相关</text></g>
