      <div class="user-message">请帮我总结一下 2026 年销售管理制度的主要变化，尤其是报价审批和合同审核部分。</div>
      <article class="assistant"><div class="assistant-head"><span class="assistant-logo">A</span><span>AtlasMind</span><span class="badge green">已查阅 3 篇</span></div>
        <div class="answer"><p>根据《2026 销售管理制度》及相关流程文件，本年度主要有三项变化：</p><ol>
          <li><strong>报价审批分级更细</strong><br>标准折扣权限调整为三级：不超过 10% 由区域负责人审批，10%–20% 需销售总监审批，超过 20% 需提交价格委员会。</li>
          <li><strong>合同审核新增数据合规检查</strong><br>涉及客户数据处理、跨境传输或第三方系统接入的合同，必须在法务审核前完成信息安全与数据合规评估。</li>
          <li><strong>审批时效纳入流程管理</strong><br>普通合同原则上 2 个工作日内完成审核；战略客户或非标准条款合同为 5 个工作日。</li>
        </ol><div class="notice"><i data-icon="file"></i><span>右侧证据面板展示了本次回答引用的文档与对应段落摘要。</span></div></div>
      </article>
