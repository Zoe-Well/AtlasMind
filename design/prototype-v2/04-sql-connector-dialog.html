<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>连接 SQL 数据源</title><link rel="stylesheet" href="prototype.css"></head>
<body data-page="data" data-overlay="dialog"><template id="page-content"><div class="content content-narrow"><div class="page-heading"><div><p class="eyebrow">Knowledge ingestion</p><h2>数据接入</h2><p>管理文档与结构化数据源。</p></div></div><div class="cards"><div class="card"><span class="card-icon"><i data-icon="file"></i></span><h3>企业文档</h3><p>PDF、DOCX、TXT、Markdown 与 HTML。</p></div><div class="card"><span class="card-icon"><i data-icon="database"></i></span><h3>SQL 数据源</h3><p>首版提供接口和配置占位，不执行真实查询。</p></div></div></div></template>
<template id="overlay-content"><header class="modal-head"><div><h2>连接 SQL 数据源</h2><p>配置只读结构化数据源。当前原型仅展示接口占位。</p></div><a class="icon-button" href="02-data-sources.html"><i data-icon="close"></i></a></header><div class="modal-body">
  <div class="notice amber"><i data-icon="alert"></i><span>首版不会保存凭据或建立真实连接。后续接入必须通过受控只读查询模板与服务端审批边界。</span></div>
  <div class="field-grid" style="margin-top:18px"><div class="field"><label>数据库类型</label><select class="input"><option>PostgreSQL</option><option>MySQL</option></select></div><div class="field"><label>连接名称</label><input class="input" value="销售分析数据库"></div><div class="field"><label>主机地址</label><input class="input" placeholder="db.internal.example"></div><div class="field"><label>端口</label><input class="input" value="5432"></div><div class="field"><label>数据库名</label><input class="input" placeholder="sales_analytics"></div><div class="field"><label>认证方式</label><select class="input"><option>企业密钥管理</option></select></div><div class="field full"><label>允许的数据集/视图</label><textarea class="textarea" placeholder="例如：analytics.monthly_sales（只读）"></textarea><span class="hint">Agent 不直接拼接 SQL，只能使用管理员批准的参数化查询能力。</span></div></div>
</div><footer class="modal-foot"><a class="button" href="02-data-sources.html">取消</a><button class="button" type="button">测试连接</button><button class="button primary" type="button">保存占位配置</button></footer></template><script src="prototype.js"></script></body></html>
