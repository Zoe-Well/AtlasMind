<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>编辑 RAG 策略</title><link rel="stylesheet" href="prototype.css"></head>
<body data-page="rag"><template id="page-content"><div class="content content-narrow">
  <div class="page-heading"><div><p class="eyebrow">Strategy editor</p><h2>GraphRAG 探索 <span class="badge amber">灰度 10%</span></h2><p>版本 graph-hybrid-v2。授权过滤始终位于检索前，不属于可配置项。</p></div><div class="top-actions"><a class="button" href="11-rag-strategies.html">返回</a><button class="button primary">保存为新版本</button></div></div>
  <div class="split"><div style="display:grid;gap:18px">
    <section class="panel"><div class="panel-head"><h3>检索来源</h3><span class="badge blue">必需</span></div><div class="panel-body"><div class="field-grid"><div class="field"><label>关键词检索权重 · 35%</label><div class="range"><span style="width:35%"></span></div></div><div class="field"><label>向量检索权重 · 65%</label><div class="range"><span style="width:65%"></span></div></div><div class="field"><label>候选证据上限</label><input class="input" value="40"></div><div class="field"><label>最终上下文片段</label><input class="input" value="12"></div></div></div></section>
    <section class="panel"><div class="panel-head"><h3>关系检索</h3><span class="toggle on"></span></div><div class="panel-body"><div class="field-grid"><div class="field"><label>最大路径深度</label><select class="input"><option>3 跳</option></select></div><div class="field"><label>关系候选上限</label><input class="input" value="24"></div><div class="field full"><label>允许的关系类型</label><input class="input" value="负责、依赖、适用、审批、引用"></div></div><div class="notice" style="margin-top:16px"><i data-icon="shield"></i><span>路径中任一节点或关系不可见时，整条候选路径会在进入 Agent 前被拒绝。</span></div></div></section>
    <section class="panel"><div class="panel-head"><h3>增强策略</h3><span class="badge">按需执行</span></div><div class="panel-body"><div class="strategy-row" style="padding-inline:0"><div><strong>问题改写</strong><small>保留原问题并生成最多 2 个检索表达</small></div><span></span><span></span><span></span><span class="toggle on"></span></div><div class="strategy-row" style="padding-inline:0"><div><strong>Self Query</strong><small>从业务字段构造受控元数据过滤</small></div><span></span><span></span><span></span><span class="toggle on"></span></div><div class="strategy-row" style="padding-inline:0"><div><strong>HyDE</strong><small>当前实验未达到基线</small></div><span></span><span></span><span></span><span class="toggle"></span></div><div class="strategy-row" style="padding-inline:0"><div><strong>上下文压缩</strong><small>仅在上下文超过预算时触发</small></div><span></span><span></span><span></span><span class="toggle on"></span></div></div></section>
  </div><aside style="display:grid;gap:18px;align-content:start"><section class="panel"><div class="panel-head"><h3>发布状态</h3></div><div class="panel-body"><div class="notice amber"><i data-icon="flask"></i><span>灰度 10%，仅对内部评估用户生效。</span></div><dl style="display:grid;gap:14px;margin:18px 0 0"><div><dt class="hint">批准基线</dt><dd>hybrid-v1</dd></div><div><dt class="hint">最近评估</dt><dd>2026-08-24 · PASSED</dd></div><div><dt class="hint">引用准确性</dt><dd>96.8%</dd></div><div><dt class="hint">权限泄露</dt><dd>0</dd></div></dl><button class="button primary" style="width:100%;margin-top:18px">运行对照评估</button><button class="button danger" style="width:100%;margin-top:8px">快速关闭</button></div></section></aside></div>
</div></template><script src="prototype.js"></script></body></html>
