openapi: 3.1.0
info:
  title: AtlasMind Enterprise Knowledge Agent API
  version: 1.0.0-draft
  description: >-
    Versioned public contract for enterprise knowledge queries, ingestion, approvals,
    evaluation, and authorized run inspection. Identity, roles, and knowledge scopes are
    derived from the verified bearer token and are never accepted from a public request body.
servers:
  - url: /api
security:
  - enterpriseBearer: []
tags:
  - name: Agent Runs
  - name: Knowledge
  - name: Approvals
  - name: Evaluation

paths:
  /v1/capabilities:
    get:
      tags: [Knowledge]
      operationId: getRuntimeCapabilities
      summary: Read server-owned runtime feature availability
      responses:
        '200':
          description: Persistent runtime capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RuntimeCapabilities' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /v1/conversations:
    get:
      tags: [Agent Runs]
      operationId: listConversations
      summary: List conversations owned by the authenticated principal
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Conversations ordered by most recent submitted turn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /v1/conversations/{conversationId}:
    get:
      tags: [Agent Runs]
      operationId: readConversation
      summary: Read persisted question and answer turns owned by the current principal
      parameters:
        - name: conversationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: before
          in: query
          description: Read turns before this ordinal; omitted returns the latest page.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Latest page in chronological order, with cursor for earlier turns
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationDetail' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { $ref: '#/components/responses/ResourceNotAvailable' }

  /v1/agent-runs:
    get:
      tags: [Agent Runs]
      operationId: listAgentRuns
      summary: List recent runs owned by the current principal
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Recent authorized runs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AgentRunList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Agent Runs]
      operationId: createAgentRun
      summary: Submit a simple knowledge query or multi-step analysis task
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentRunRequest'
      responses:
        '202':
          description: Run accepted or already accepted with the same idempotency key
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ResourceNotAvailable'
        '409':
          $ref: '#/components/responses/InvalidState'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/agent-runs/{runId}:
    get:
      tags: [Agent Runs]
      operationId: getAgentRun
      summary: Read current run status and authorized result
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Run visible to the current principal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ResourceNotAvailable'

  /v1/agent-runs/{runId}/cancel:
    post:
      tags: [Agent Runs]
      operationId: cancelAgentRun
      summary: Request cancellation of a run owned by the current principal
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '202':
          description: Cancellation accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentRun'
        '404':
          $ref: '#/components/responses/ResourceNotAvailable'
        '409':
          $ref: '#/components/responses/InvalidState'
  /v1/agent-runs/{runId}/events:
    get:
      tags: [Agent Runs]
      operationId: streamAgentRunEvents
      summary: Replay and follow the authorized AG-UI event stream
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: after
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: Last-Event-ID
          in: header
          schema: { type: string, pattern: '^[0-9]+$' }
          description: Last persisted per-run sequence received by the client.
      responses:
        '200':
          description: >-
            SSE stream. Each data object is an AG-UI event with AtlasMind metadata
            containing schemaVersion, eventId, sequence, runId, correlationId and visibility.
            Retrieval Workflow progress uses ACTIVITY_SNAPSHOT with
            activityType=atlasmind.retrieval. Its allowlisted content contains only stage,
            strategyId, status, public summary, bounded counts/timing, selected strategy IDs and
            a mapped degradation code; it never contains query text, prompt, scope or evidence body.
          content:
            text/event-stream:
              schema: { type: string }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/ResourceNotAvailable'

  /v1/documents:
    get:
      tags: [Knowledge]
      operationId: listDocuments
      summary: List documents visible to the current principal
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
      responses:
        '200':
          description: Authorized document list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentList' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    post:
      tags: [Knowledge]
      operationId: uploadDocument
      summary: Create a document and initial immutable version
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, title, sourceKey, knowledgeScopeCodes]
              properties:
                file:
                  type: string
                  format: binary
                title:
                  type: string
                  minLength: 1
                  maxLength: 500
                sourceKey:
                  type: string
                  minLength: 1
                  maxLength: 300
                knowledgeScopeCodes:
                  type: array
                  minItems: 1
                  items:
                    type: string
                metadata:
                  type: string
                  description: JSON object validated against the active metadata schema
      responses:
        '202':
          description: Upload accepted and ingestion job created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadResult'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ActionNotAllowed'
        '409':
          description: Duplicate or version relation requires a caller decision
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /v1/documents/{documentId}:
    get:
      tags: [Knowledge]
      operationId: getDocument
      summary: Read document metadata visible to the current principal
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Visible document metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '404':
          $ref: '#/components/responses/ResourceNotAvailable'
    delete:
      tags: [Knowledge]
      operationId: revokeDocument
      summary: Revoke a document from future retrieval
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '202':
          description: Document synchronously hidden and projection cleanup scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '403':
          $ref: '#/components/responses/ActionNotAllowed'
        '404':
          $ref: '#/components/responses/ResourceNotAvailable'

  /v1/documents/{documentId}/versions:
    get:
      tags: [Knowledge]
      operationId: listDocumentVersions
      summary: List immutable versions visible for a document
      parameters:
        - $ref: '#/components/parameters/DocumentId'
      responses:
        '200':
          description: Authorized document versions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentVersionList' }
        '404': { $ref: '#/components/responses/ResourceNotAvailable' }
    post:
      tags: [Knowledge]
      operationId: uploadDocumentVersion
      summary: Add an immutable replacement version
      parameters:
        - $ref: '#/components/parameters/DocumentId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                versionLabel:
                  type: string
                  maxLength: 100
                metadata:
                  type: string
                  description: JSON object validated against the active metadata schema
      responses:
        '202':
          description: Version and ingestion job created; active version is unchanged
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentUploadResult'
        '403':
          $ref: '#/components/responses/ActionNotAllowed'
        '404':
          $ref: '#/components/responses/ResourceNotAvailable'
        '409':
          $ref: '#/components/responses/InvalidState'

  /v1/ingestion-jobs/{jobId}:
    get:
      tags: [Knowledge]
      operationId: getIngestionJob
      summary: Read an authorized ingestion job
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Ingestion state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionJob'
        '404':
          $ref: '#/components/responses/ResourceNotAvailable'

  /v1/ingestion-jobs/{jobId}/retry:
    post:
      tags: [Knowledge]
      operationId: retryIngestionJob
      summary: Retry a corrected failed ingestion job
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionJob'
        '403':
          $ref: '#/components/responses/ActionNotAllowed'
        '404':
          $ref: '#/components/responses/ResourceNotAvailable'
        '409':
          $ref: '#/components/responses/InvalidState'

  /v1/document-versions/{versionId}/metadata-review:
    post:
      tags: [Knowledge]
      operationId: reviewDocumentVersionMetadata
      summary: Confirm or correct critical metadata before activation
      parameters:
        - $ref: '#/components/parameters/DocumentVersionId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetadataReviewRequest'
      responses:
        '200':
          description: Metadata review recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataReviewResult'
        '403':
          $ref: '#/components/responses/ActionNotAllowed'
        '404':
          $ref: '#/components/responses/ResourceNotAvailable'
        '409':
          $ref: '#/components/responses/InvalidState'

  /v1/graph:
    get:
      tags: [Graph Governance]
      operationId: getGraphSnapshot
      summary: Browse authorized active graph entities, relations, and provenance
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
        - name: query
          in: query
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: entityType
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - name: relationType
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - name: minimumConfidence
          in: query
          schema: { type: number, minimum: 0, maximum: 1 }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Authorized graph snapshot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphSnapshot'
        '403':
          $ref: '#/components/responses/ActionNotAllowed'

  /v1/graph/entities:
    get:
      tags: [Graph Explorer]
      operationId: searchGraphEntities
      summary: Search entities visible through authorized active source documents
      parameters:
        - name: query
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: entityType
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Authorized entity matches
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphEntitySearchResult' }
        '403': { $ref: '#/components/responses/ActionNotAllowed' }

  /v1/graph/entities/{entityId}:
    get:
      tags: [Graph Explorer]
      operationId: getGraphEntity
      summary: Read an authorized entity and its source-document provenance
      parameters:
        - name: entityId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Authorized entity detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphEntityDetail' }
        '404': { $ref: '#/components/responses/ResourceNotAvailable' }

  /v1/graph/entities/{entityId}/neighbors:
    get:
      tags: [Graph Explorer]
      operationId: getGraphEntityNeighbors
      summary: Expand a bounded authorized local graph around an entity
      parameters:
        - name: entityId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: depth
          in: query
          schema: { type: integer, minimum: 1, maximum: 3, default: 1 }
        - name: entityType
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - name: relationType
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - name: minimumConfidence
          in: query
          schema: { type: number, minimum: 0, maximum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 2, maximum: 200, default: 80 }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Incremental authorized scene data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphSnapshot' }
        '404': { $ref: '#/components/responses/ResourceNotAvailable' }

  /v1/graph/relations/{relationId}:
    get:
      tags: [Graph Explorer]
      operationId: getGraphRelation
      summary: Read relation confidence and authorized source evidence
      parameters:
        - name: relationId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Authorized relation evidence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GraphEdge' }
        '404': { $ref: '#/components/responses/ResourceNotAvailable' }

  /v1/rag/strategies:
    get:
      tags: [Knowledge]
      operationId: getRagStrategies
      summary: Read the internal Retrieval Strategy catalog and active availability
      responses:
        '200':
          description: Server-owned Strategy catalog; entries are not Agent tools
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RagStrategyCatalog' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

  /v1/rag/policy:
    get:
      tags: [Knowledge]
      operationId: getRagPolicy
      summary: Read the active versioned Advanced RAG policy
      responses:
        '200':
          description: Active Advanced RAG policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RagPolicy' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
    put:
      tags: [Knowledge]
      operationId: updateRagPolicy
      summary: Validate and activate a new immutable Advanced RAG policy version
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RagPolicyUpdate' }
      responses:
        '200':
          description: Newly active Advanced RAG policy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RagPolicy' }
        '403': { $ref: '#/components/responses/ActionNotAllowed' }
        '422': { $ref: '#/components/responses/InvalidRequest' }

  /v1/graph/conflicts:
    get:
      tags: [Graph Governance]
      operationId: listGraphConflicts
      summary: List conflicted graph relations visible to an authorized graph manager
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Conflicted relation identifiers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphConflictList'
        '403':
          $ref: '#/components/responses/ActionNotAllowed'
  /v1/graph/policy:
    get:
      tags: [Graph Governance]
      operationId: getGraphPolicy
      summary: Read the active entity filtering, resolution, and graph retrieval policy
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Active versioned graph policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphPolicy'
        '403':
          $ref: '#/components/responses/ActionNotAllowed'
    put:
      tags: [Graph Governance]
      operationId: updateGraphPolicy
      summary: Replace the graph policy with a new immutable version
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphPolicyUpdate'
      responses:
        '200':
          description: Newly active graph policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphPolicy'
        '403':
          $ref: '#/components/responses/ActionNotAllowed'
        '422':
          $ref: '#/components/responses/InvalidRequest'

  /v1/graph/entities/{entityId}/merge:
    post:
      tags: [Graph Governance]
      operationId: mergeGraphEntity
      summary: Merge an entity into an approved canonical target
      parameters:
        - name: entityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphEntityMergeRequest'
      responses:
        '200':
          description: Entity merge recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphEntityMergeResult'
        '403':
          $ref: '#/components/responses/ActionNotAllowed'
        '404':
          $ref: '#/components/responses/ResourceNotAvailable'

  /v1/approval-requests/{approvalId}:
    get:
      tags: [Approvals]
      operationId: getApprovalRequest
      summary: Read an approval challenge visible to the current approver
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Approval challenge with normalized target and parameter summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        '404':
          $ref: '#/components/responses/ResourceNotAvailable'

  /v1/approval-requests/{approvalId}/decision:
    post:
      tags: [Approvals]
      operationId: decideApprovalRequest
      summary: Approve or deny one parameter-bound side effect
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalDecision'
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRequest'
        '403':
          $ref: '#/components/responses/ActionNotAllowed'
        '404':
          $ref: '#/components/responses/ResourceNotAvailable'
        '409':
          $ref: '#/components/responses/InvalidState'

  /v1/evaluation-runs:
    post:
      tags: [Evaluation]
      operationId: createEvaluationRun
      summary: Run an approved, versioned evaluation dataset
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvaluationRunRequest'
      responses:
        '202':
          description: Evaluation queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationRun'
        '403':
          $ref: '#/components/responses/ActionNotAllowed'

  /v1/evaluation-runs/{evaluationRunId}:
    get:
      tags: [Evaluation]
      operationId: getEvaluationRun
      summary: Read authorized evaluation status and gate results
      parameters:
        - name: evaluationRunId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationRun'
        '404':
          $ref: '#/components/responses/ResourceNotAvailable'

components:
  securitySchemes:
    enterpriseBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Caller correlation ID; server generates one when absent
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 200
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentId:
      name: documentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DocumentVersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  headers:
    CorrelationId:
      schema:
        type: string
        format: uuid
      description: Effective correlation ID

  schemas:
    RuntimeCapabilities:
      type: object
      required: [dataMode, localSuperAdmin, features]
      properties:
        dataMode: { type: string, enum: [persistent] }
        localSuperAdmin: { type: boolean }
        features:
          type: object
          required: [knowledge, agentRuns, graphConflicts, graphBrowse, approvals, evaluations]
          properties:
            knowledge: { type: boolean }
            agentRuns: { type: boolean }
            graphConflicts: { type: boolean }
            graphBrowse: { type: boolean }
            approvals: { type: boolean }
            evaluations: { type: boolean }
            serviceKnowledge: { type: boolean }
    CreateAgentRunRequest:
      type: object
      additionalProperties: false
      required: [query]
      properties:
        query:
          type: string
          minLength: 1
          maxLength: 16000
        mode:
          type: string
          enum: [AUTO, SIMPLE, MULTI_SOURCE, GRAPH]
          default: AUTO
        conversationId:
          type: [string, 'null']
          format: uuid
          description: Append to an owned conversation; omitted starts a new one. Returns 409 if another turn is active.
        responseLanguage:
          type: [string, 'null']
          maxLength: 20
        clientContext:
          type: object
          additionalProperties: false
          properties:
            locale:
              type: string
              maxLength: 20
      description: Roles, subject, and knowledge scopes are intentionally absent

    Conversation:
      type: object
      required: [id, title, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, maxLength: 120 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConversationList:
      type: object
      required: [items, nextOffset]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Conversation' }
        nextOffset: { type: [integer, 'null'], minimum: 0 }
    ConversationDetail:
      type: object
      required: [conversation, items, nextBefore]
      properties:
        conversation: { $ref: '#/components/schemas/Conversation' }
        items:
          type: array
          items: { $ref: '#/components/schemas/AgentRun' }
        nextBefore: { type: [integer, 'null'], minimum: 1 }
    AgentRun:
      type: object
      required: [id, correlationId, state, createdAt, links]
      properties:
        id:
          type: string
          format: uuid
        conversationId:
          type: [string, 'null']
          format: uuid
        turnIndex:
          type: [integer, 'null']
          minimum: 1
        query:
          type: [string, 'null']
          description: Original user message; null for legacy records whose question was not saved.
        correlationId:
          type: string
          format: uuid
        traceId:
          type: [string, 'null']
          pattern: '^[0-9a-f]{32}$'
        state:
          type: string
          enum: [QUEUED, RUNNING, WAITING_APPROVAL, COMPLETED, PARTIAL, FAILED, TIMED_OUT, CANCELLED]
        taskType:
          type: string
          enum: [SIMPLE, MULTI_SOURCE, GRAPH]
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
        answer:
          oneOf:
            - $ref: '#/components/schemas/Answer'
            - type: 'null'
        pendingApproval:
          oneOf:
            - $ref: '#/components/schemas/ApprovalRequestSummary'
            - type: 'null'
        failure:
          oneOf:
            - $ref: '#/components/schemas/Failure'
            - type: 'null'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/RunStepSummary'
        links:
          type: object
          required: [self]
          properties:
            self:
              type: string
        approval:
          type: [string, 'null']

    RunStepSummary:
      type: object
      required: [id, ordinal, kind, state]
      properties:
        id:
          type: string
          format: uuid
        ordinal:
          type: integer
          minimum: 1
        kind:
          type: string
          enum: [PLAN, RETRIEVAL, TOOL, COMPOSE, VERIFY]
        state:
          type: string
          enum: [PENDING, RUNNING, WAITING_APPROVAL, SUCCEEDED, FAILED, SKIPPED]
        capabilityName:
          type: [string, 'null']
          enum: [knowledge_search, search_knowledge, search_graph, query_structured_data, null]
        resultRef:
          type: [string, 'null']
        startedAt:
          type: [string, 'null']
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time

    AgentRunList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentRun'
        total:
          type: integer
          minimum: 0

    Answer:
      type: object
      required: [text, confidence, evidenceStatus, citations]
      properties:
        text:
          type: string
        confidence:
          type: string
          enum: [HIGH, MEDIUM, LOW]
        evidenceStatus:
          type: string
          enum: [SUFFICIENT, PARTIAL, CONFLICTED, INSUFFICIENT]
        limitations:
          type: array
          items:
            type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        graphPaths:
          type: array
          items:
            $ref: '#/components/schemas/GraphPath'

    Citation:
      type: object
      required: [id, claimLocator, source, supportStatus]
      properties:
        id:
          type: string
          format: uuid
        claimLocator:
          type: string
        source:
          $ref: '#/components/schemas/SourceReference'
        supportStatus:
          type: string
          enum: [SUPPORTED, PARTIAL, CONFLICTED]

    SourceReference:
      type: object
      required: [type, id, version, locator, title]
      properties:
        type:
          type: string
          enum: [DOCUMENT, STRUCTURED, GRAPH, EXTERNAL]
        id:
          type: string
        version:
          type: string
        locator:
          type: string
        title:
          type: string
        excerpt:
          type: [string, 'null']
          description: Authorization-filtered source excerpt for evidence preview
        href:
          type: [string, 'null']

    Failure:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
          enum: [INSUFFICIENT_EVIDENCE, SOURCE_UNAVAILABLE, TOOL_FAILED, BUDGET_EXCEEDED, AUTHORIZATION_CHANGED, INTERNAL_ERROR]
        message:
          type: string
        retryable:
          type: boolean

    DocumentUploadResult:
      type: object
      required: [document, versionId, ingestionJob]
      properties:
        document:
          $ref: '#/components/schemas/Document'
        versionId:
          type: string
          format: uuid
        ingestionJob:
          $ref: '#/components/schemas/IngestionJob'

    Document:
      type: object
      required: [id, title, sourceKey, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        sourceKey:
          type: string
        status:
          type: string
          enum: [ACTIVE, REVOKED, DELETED]
        activeVersionId:
          type: [string, 'null']
          format: uuid
        knowledgeScopes:
          type: array
          items:
            type: string
          description: Only scope labels the current principal may discover
        createdAt:
          type: string
          format: date-time

    DocumentList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Document'
        total:
          type: integer
          minimum: 0

    DocumentVersion:
      type: object
      required: [id, versionLabel, lifecycleState, searchable, sizeBytes, createdAt]
      properties:
        id:
          type: string
          format: uuid
        versionLabel:
          type: string
        lifecycleState:
          type: string
        searchable:
          type: boolean
        sizeBytes:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        ingestionJobId:
          type: [string, 'null']
          format: uuid
        ingestionState:
          type: [string, 'null']

    DocumentVersionList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DocumentVersion'
        total:
          type: integer
          minimum: 0

    IngestionJob:
      type: object
      required: [id, documentVersionId, state, currentStage, attempt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        documentVersionId:
          type: string
          format: uuid
        state:
          type: string
          enum: [QUEUED, RUNNING, WAITING_METADATA_REVIEW, SEARCHABLE, FAILED, CANCELLED]
        currentStage:
          type: string
          enum: [VALIDATING, PARSING, CHUNKING, METADATA, LEXICAL_INDEX, VECTOR_INDEX, GRAPH_INDEX, ACTIVATING]
        attempt:
          type: integer
          minimum: 0
        failure:
          oneOf:
            - $ref: '#/components/schemas/Failure'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time

    MetadataReviewRequest:
      type: object
      additionalProperties: false
      required: [approved]
      properties:
        approved:
          type: boolean
        corrections:
          type: object
          additionalProperties: true
          default: {}

    MetadataReviewResult:
      type: object
      additionalProperties: false
      required: [documentVersionId, approved, metadata]
      properties:
        documentVersionId:
          type: string
          format: uuid
        approved:
          type: boolean
        metadata:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MetadataReviewRecord'

    MetadataReviewRecord:
      type: object
      additionalProperties: false
      required: [value, status]
      properties:
        value: {}
        status:
          type: string
          enum: [PENDING, CONFIRMED, REJECTED]

    GraphConflictList:
      type: object
      additionalProperties: false
      required: [relations]
      properties:
        relations:
          type: array
          items:
            type: string
            format: uuid

    GraphSnapshot:
      type: object
      additionalProperties: false
      required: [nodes, edges, mode, truncated]
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdge'
        mode:
          type: string
          enum: [GLOBAL, LOCAL]
        truncated: { type: boolean }
        rootEntityId: { type: string, format: uuid }
        depth: { type: integer, minimum: 1, maximum: 3 }

    GraphEntitySearchResult:
      type: object
      additionalProperties: false
      required: [items, truncated]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/GraphNode' }
        truncated: { type: boolean }

    GraphEntityDetail:
      allOf:
        - $ref: '#/components/schemas/GraphNode'
        - type: object
          required: [degree, properties, sourceDocuments]
          properties:
            degree: { type: integer, minimum: 0 }
            properties:
              type: object
              additionalProperties: true
            sourceDocuments:
              type: array
              items: { $ref: '#/components/schemas/GraphEntitySource' }

    GraphEntitySource:
      allOf:
        - $ref: '#/components/schemas/GraphEvidence'
        - type: object
          required: [surface, confidence]
          properties:
            surface: { type: string }
            confidence: { type: number, minimum: 0, maximum: 1 }
    RagStrategyConfiguration:
      type: object
      additionalProperties: false
      required: [enabled, settings]
      properties:
        enabled: { type: boolean }
        settings:
          type: object
          additionalProperties: true

    RetrievalRuntimeBudget:
      type: object
      additionalProperties: false
      required:
        - totalTimeoutMs
        - strategyTimeoutMs
        - maxLlmCalls
        - maxEmbeddingCalls
        - maxRetrievalCalls
        - maxQueryVariants
        - maxCandidatesPerRetriever
        - maxTotalCandidates
        - resultLimit
        - maxStrategyRetries
      properties:
        totalTimeoutMs: { type: integer, minimum: 500, maximum: 8000 }
        strategyTimeoutMs: { type: integer, minimum: 100, maximum: 4000 }
        maxLlmCalls: { type: integer, minimum: 1, maximum: 6 }
        maxEmbeddingCalls: { type: integer, minimum: 1, maximum: 12 }
        maxRetrievalCalls: { type: integer, minimum: 1, maximum: 12 }
        maxQueryVariants: { type: integer, minimum: 1, maximum: 5 }
        maxCandidatesPerRetriever: { type: integer, minimum: 1, maximum: 80 }
        maxTotalCandidates: { type: integer, minimum: 8, maximum: 240 }
        resultLimit: { type: integer, minimum: 1, maximum: 12 }
        maxStrategyRetries: { type: integer, minimum: 0, maximum: 1 }

    RagPolicyUpdate:
      type: object
      additionalProperties: false
      required: [strategies, budget]
      properties:
        strategies:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/RagStrategyConfiguration'
        budget:
          $ref: '#/components/schemas/RetrievalRuntimeBudget'

    RagPolicy:
      allOf:
        - $ref: '#/components/schemas/RagPolicyUpdate'
        - type: object
          required: [version, canManage]
          properties:
            version: { type: integer, minimum: 1 }
            canManage: { type: boolean }

    RagStrategyCatalogItem:
      type: object
      additionalProperties: false
      required:
        - id
        - stage
        - description
        - enabled
        - settings
        - settingsSchema
        - planParametersSchema
        - conflictsWith
      properties:
        id: { type: string }
        stage:
          type: string
          enum: [QUERY_PROCESSING, RETRIEVAL, FUSION, RERANK]
        description: { type: string }
        enabled: { type: boolean }
        settings: { type: object, additionalProperties: true }
        settingsSchema: { type: object, additionalProperties: true }
        planParametersSchema: { type: object, additionalProperties: true }
        conflictsWith:
          type: array
          items: { type: string }

    RagStrategyCatalog:
      type: object
      additionalProperties: false
      required: [policyVersion, strategies]
      properties:
        policyVersion: { type: integer, minimum: 1 }
        strategies:
          type: array
          items: { $ref: '#/components/schemas/RagStrategyCatalogItem' }

    GraphPolicyUpdate:
      type: object
      additionalProperties: false
      required: [allowedEntityTypes, allowedRelationTypes]
      properties:
        allowedEntityTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [SYSTEM, PRODUCT, SERVICE, API, ERROR_CODE, ORGANIZATION, ORG_UNIT, DATABASE, QUEUE, TECH_COMPONENT]
        allowedRelationTypes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [CALLS, CONSUMES, DEPENDS_ON, DEPLOYED_ON, EXPOSES, INTEGRATES_WITH, MANAGED_BY, OWNED_BY, PART_OF, PRODUCES, RETURNS_ERROR, STORES_IN, USES]
        minimumEntityConfidence: { type: number, minimum: 0, maximum: 1, default: 0.6 }
        minimumRelationConfidence: { type: number, minimum: 0, maximum: 1, default: 0.7 }
        seedLimit: { type: integer, minimum: 1, maximum: 30, default: 8 }
        maxHops: { type: integer, minimum: 1, maximum: 2, default: 2 }
        maxNodes: { type: integer, minimum: 2, maximum: 200, default: 40 }
        maxPaths: { type: integer, minimum: 1, maximum: 100, default: 24 }
        maxGraphChunks: { type: integer, minimum: 1, maximum: 100, default: 24 }
        allowedAliases:
          type: object
          additionalProperties:
            type: string
    GraphPolicy:
      allOf:
        - $ref: '#/components/schemas/GraphPolicyUpdate'
        - type: object
          required: [version, availableEntityTypes, canManage]
          properties:
            version: { type: integer, minimum: 1 }
            availableEntityTypes:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
                enum: [SYSTEM, PRODUCT, SERVICE, API, ERROR_CODE, ORGANIZATION, ORG_UNIT, DATABASE, QUEUE, TECH_COMPONENT]
            canManage:
              type: boolean
              description: Whether the current principal may create a new graph policy version

    GraphNode:
      type: object
      additionalProperties: false
      required: [id, name, type, aliases, mentionCount, documentCount]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string }
        aliases:
          type: array
          items: { type: string }
        mentionCount: { type: integer, minimum: 1 }
        documentCount: { type: integer, minimum: 1 }

    GraphEdge:
      type: object
      additionalProperties: false
      required: [id, source, target, type, confidence, evidence]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, format: uuid }
        target: { type: string, format: uuid }
        type: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        evidence:
          type: array
          items:
            $ref: '#/components/schemas/GraphEvidence'

    GraphEvidence:
      type: object
      additionalProperties: false
      required: [documentId, documentTitle, documentVersionId, chunkId, locator]
      properties:
        documentId: { type: string, format: uuid }
        documentTitle: { type: string }
        documentVersionId: { type: string, format: uuid }
        chunkId: { type: string, format: uuid }
        locator: { type: string }

    GraphPath:
      type: object
      additionalProperties: false
      required: [entities, relations, directions, sources]
      properties:
        entities:
          type: array
          minItems: 2
          items: { type: string }
        relations:
          type: array
          minItems: 1
          items: { type: string }
        directions:
          type: array
          minItems: 1
          items: { type: boolean }
        sources:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [chunkId, locator]
            properties:
              chunkId: { type: string, format: uuid }
              locator: { type: string }

    GraphEntityMergeRequest:
      type: object
      additionalProperties: false
      required: [targetEntityId, approved]
      properties:
        targetEntityId:
          type: string
          format: uuid
        approved:
          type: boolean

    GraphEntityMergeResult:
      type: object
      additionalProperties: false
      required: [id, status, mergedIntoId]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [MERGED]
        mergedIntoId:
          type: string
          format: uuid

    ApprovalRequestSummary:
      type: object
      required: [id, state, capability, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [PENDING, APPROVED, DENIED, EXPIRED, CONSUMED]
        capability:
          type: string
        expiresAt:
          type: string
          format: date-time

    ApprovalRequest:
      allOf:
        - $ref: '#/components/schemas/ApprovalRequestSummary'
        - type: object
          required: [targetSummary, parameterSummary, correlationId]
          properties:
            targetSummary:
              type: string
            parameterSummary:
              type: object
              additionalProperties: true
              description: Redacted, normalized parameters bound to this decision
            correlationId:
              type: string
              format: uuid

    ApprovalDecision:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision:
          type: string
          enum: [APPROVE, DENY]
        reason:
          type: [string, 'null']
          maxLength: 1000

    CreateEvaluationRunRequest:
      type: object
      additionalProperties: false
      required: [datasetId, datasetVersion]
      properties:
        datasetId:
          type: string
          minLength: 1
        datasetVersion:
          type: string
        retrievalPolicyVersion:
          type: [string, 'null']

    EvaluationRun:
      type: object
      required: [id, dataset, state, createdAt]
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
          enum: [QUEUED, RUNNING, PASSED, FAILED, INVALID]
        dataset:
          type: object
          additionalProperties: false
          required: [id, version]
          properties:
            id:
              type: string
            version:
              type: string
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: [string, 'null']
          format: date-time
        reportRef:
          type: [string, 'null']
          format: uri-reference
        gates:
          type: array
          items:
            type: object
            required: [name, passed]
            properties:
              name:
                type: string
              passed:
                type: boolean
              value:
                type: [number, string, 'null']
              threshold:
                type: [number, string, 'null']

    Problem:
      type: object
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        detail:
          type: string
        correlationId:
          type: string
          format: uuid
        retryable:
          type: boolean

  responses:
    InvalidRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthenticated:
      description: Missing or invalid enterprise identity
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ActionNotAllowed:
      description: Current principal cannot perform this known action
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ResourceNotAvailable:
      description: Resource does not exist or is not visible to the current principal
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidState:
      description: Resource cannot accept this transition
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    RateLimited:
      description: Request exceeds an applicable budget or rate limit
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
